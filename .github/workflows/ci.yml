name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Web/PWA evidence gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prod=false
      - run: pnpm run check:project-local-boundary
      - run: pnpm run check:hosted-ci-workflow-contract
      - name: Refresh native prerequisite diagnostic for Web-local verification
        continue-on-error: true
        run: node scripts/native-build-prereq-check.mjs --platform=all --report=.manual-qa/native-prereq-all-platforms.json
      - run: pnpm run verify:web-local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-audit
          path: .visual-audit

  windows-native:
    name: Windows native shell
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prod=false
      - uses: microsoft/setup-msbuild@v2
      - run: pnpm run check:project-local-boundary
      - name: Check Windows prerequisites
        shell: pwsh
        run: node scripts\native-build-prereq-check.mjs --platform=windows --report=.manual-qa\native-prereq-windows.json
      - name: Validate Windows prerequisite report
        if: always()
        shell: pwsh
        run: node scripts\runtime-smoke-artifact-check.mjs --only-native-prereq-report --require-native-prereq=.manual-qa/native-prereq-windows.json
      - run: pnpm run build
      - name: Build Windows Release shell
        shell: pwsh
        run: .\scripts\build-windows.ps1 -Configuration Release -SkipWebBuild
      - name: Smoke Windows WebView runtime
        shell: pwsh
        run: .\scripts\windows-webview-runtime-smoke.ps1 -Configuration Release -Platform x64
      - name: Validate Windows runtime smoke artifact
        shell: pwsh
        run: node scripts\runtime-smoke-artifact-check.mjs --only-runtime-artifact --require-runtime-artifact=windows
      - name: Build Windows Release shell for MSIX
        shell: pwsh
        run: .\scripts\build-windows.ps1 -Configuration Release -SkipWebBuild -MsixReady
      - name: Package unsigned MSIX
        shell: pwsh
        run: .\scripts\package-windows-msix.ps1 -BuildRoot .local\codex\artifacts\windows-build -Configuration Release -Platform x64
      - name: Inspect MSIX install readiness
        shell: pwsh
        run: .\scripts\windows-msix-install-qa.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-release-shell
          path: |
            .local\codex\artifacts\windows-build\output\x64\Release
            .manual-qa\ZeroChat_*.msix
            .manual-qa\windows-webview-runtime-smoke.png
            .manual-qa\windows-webview-runtime-smoke.json
            .manual-qa\native-prereq-windows.json

  android-native:
    name: Android debug/release build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || test "${PIPESTATUS[1]}" -eq 0
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: pnpm install --frozen-lockfile --prod=false
      - run: pnpm run check:project-local-boundary
      - name: Check Android prerequisites
        run: node scripts/native-build-prereq-check.mjs --platform=android --report=.manual-qa/native-prereq-android.json
      - name: Validate Android prerequisite report
        if: always()
        run: node scripts/runtime-smoke-artifact-check.mjs --only-native-prereq-report --require-native-prereq=.manual-qa/native-prereq-android.json
      - name: Run Android Lint
        shell: bash
        run: |
          chmod +x apps/android/gradlew
          node scripts/android-debug-build.mjs lintDebug
      - name: Run Android JVM unit tests
        shell: bash
        run: |
          chmod +x apps/android/gradlew
          node scripts/android-debug-build.mjs testDebugUnitTest
      - name: Build Android debug APK
        shell: bash
        run: |
          chmod +x apps/android/gradlew
          node scripts/android-debug-build.mjs
      - name: Build Android release APK
        run: node scripts/android-debug-build.mjs assembleRelease
      - name: Check Android release APK size
        run: node scripts/android-release-size-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-native-prereq
          path: .manual-qa/native-prereq-android.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-release-apk
          path: |
            apps/android/app/build/outputs/apk/release/*.apk
            .manual-qa/android-release-size.json

  linux-native:
    name: Linux GTK release build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prod=false
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm run check:project-local-boundary
      - name: Install GTK dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-4-dev libadwaita-1-dev libsecret-tools xvfb xdotool imagemagick dbus-x11
      - name: Check Linux prerequisites
        run: node scripts/native-build-prereq-check.mjs --platform=linux --report=.manual-qa/native-prereq-linux.json
      - name: Validate Linux prerequisite report
        if: always()
        run: node scripts/runtime-smoke-artifact-check.mjs --only-native-prereq-report --require-native-prereq=.manual-qa/native-prereq-linux.json
      - name: Check Linux native app
        run: cargo check --manifest-path apps/linux/Cargo.toml --locked
      - name: Build Linux release binary
        run: pnpm run build:linux:release
      - name: Smoke Linux runtime under Xvfb
        run: bash scripts/linux-runtime-smoke.sh apps/linux/target/release/zerochat-linux
      - name: Validate Linux runtime smoke artifact
        run: node scripts/runtime-smoke-artifact-check.mjs --only-runtime-artifact --require-runtime-artifact=linux
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-release-binary-and-runtime-smoke
          path: |
            apps/linux/target/release/zerochat-linux
            .manual-qa/linux-runtime-smoke.png
            .manual-qa/linux-runtime-smoke.json
            .manual-qa/native-prereq-linux.json

  apple-core:
    name: Apple Swift/Xcode build
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prod=false
      - run: pnpm run check:project-local-boundary
      - name: Check Apple prerequisites
        run: node scripts/native-build-prereq-check.mjs --platform=apple --report=.manual-qa/native-prereq-apple.json
      - name: Validate Apple prerequisite report
        if: always()
        run: node scripts/runtime-smoke-artifact-check.mjs --only-native-prereq-report --require-native-prereq=.manual-qa/native-prereq-apple.json
      - name: Build Apple macOS and iOS Simulator apps
        run: pnpm run build:apple:debug
      - name: Smoke macOS runtime
        run: bash scripts/apple-runtime-smoke.sh .manual-qa/apple-derived-data/Build/Products/Debug/ZeroChat.app
      - name: Validate Apple runtime smoke artifact
        run: node scripts/runtime-smoke-artifact-check.mjs --only-runtime-artifact --require-runtime-artifact=apple
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-runtime-smoke
          path: |
            .manual-qa/apple-runtime-smoke.png
            .manual-qa/apple-runtime-smoke.json
            .manual-qa/native-prereq-apple.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-ios-simulator-build
          path: .manual-qa/apple-ios-simulator-derived-data/Build/Products/Debug-iphonesimulator/ZeroChat.app

  hosted-native-ci-evidence:
    name: Hosted native CI evidence report
    runs-on: ubuntu-latest
    needs:
      - windows-native
      - android-native
      - linux-native
      - apple-core
    if: ${{ needs.windows-native.result == 'success' && needs.android-native.result == 'success' && needs.linux-native.result == 'success' && needs.apple-core.result == 'success' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/project-local-boundary-check.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: windows-release-shell
          path: .manual-qa/hosted-native-ci/windows-release-shell
      - uses: actions/download-artifact@v4
        with:
          name: android-native-prereq
          path: .manual-qa/hosted-native-ci/android-native-prereq
      - uses: actions/download-artifact@v4
        with:
          name: android-debug-apk
          path: .manual-qa/hosted-native-ci/android-debug-apk
      - uses: actions/download-artifact@v4
        with:
          name: android-release-apk
          path: .manual-qa/hosted-native-ci/android-release-apk
      - uses: actions/download-artifact@v4
        with:
          name: linux-release-binary-and-runtime-smoke
          path: .manual-qa/hosted-native-ci/linux-release-binary-and-runtime-smoke
      - uses: actions/download-artifact@v4
        with:
          name: apple-runtime-smoke
          path: .manual-qa/hosted-native-ci/apple-runtime-smoke
      - uses: actions/download-artifact@v4
        with:
          name: apple-ios-simulator-build
          path: .manual-qa/hosted-native-ci/apple-ios-simulator-build/ZeroChat.app
      - name: Generate hosted native CI evidence report
        run: >
          node scripts/hosted-native-ci-evidence-report.mjs
          --repository=${{ github.repository }}
          --run-id=${{ github.run_id }}
          --run-attempt=${{ github.run_attempt }}
          --head-sha=${{ github.sha }}
          --jobs-success
      - name: Validate hosted native CI evidence report
        run: node scripts/hosted-native-ci-evidence-check.mjs --report=.manual-qa/hosted-native-ci-evidence.json --require
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-native-ci-evidence
          path: .manual-qa/hosted-native-ci-evidence.json
