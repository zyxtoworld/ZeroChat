name: Deploy Web

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prod=false
      - run: pnpm run check:project-local-boundary
      - name: Refresh native prerequisite diagnostic for Web-local verification
        continue-on-error: true
        run: node scripts/native-build-prereq-check.mjs --platform=all --report=.manual-qa/native-prereq-all-platforms.json
      - run: pnpm run verify:web-local
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-audit-pages
          path: .visual-audit
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
