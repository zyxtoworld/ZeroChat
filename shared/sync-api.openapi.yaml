openapi: 3.1.0
info:
  title: ZeroChat Sync API
  version: 1.0.0
paths:
  /snapshot:
    get:
      summary: Read the current snapshot
      security:
        - bearerToken: []
      responses:
        "200":
          description: Encrypted snapshot found
          content:
            application/json:
              schema:
                $ref: "./encrypted-snapshot.schema.json"
        "404":
          description: No snapshot exists yet
        "401":
          description: Missing or invalid sync token
    put:
      summary: Replace the current encrypted snapshot
      security:
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "./encrypted-snapshot.schema.json"
      responses:
        "200":
          description: Snapshot saved
        "400":
          description: Invalid JSON
        "401":
          description: Missing or invalid sync token
        "413":
          description: Snapshot too large
    delete:
      summary: Delete the legacy encrypted snapshot after incremental migration
      security:
        - bearerToken: []
      responses:
        "200":
          description: Snapshot deleted
        "401":
          description: Missing or invalid sync token
  /sync/head:
    get:
      summary: Read the current incremental sync head
      security:
        - bearerToken: []
      responses:
        "200":
          description: Incremental head found
        "404":
          description: No incremental head exists yet
        "501":
          description: R2 binding is not configured
    put:
      summary: Replace the current incremental sync head
      security:
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, version, manifestKey, updatedAt]
              properties:
                kind:
                  const: zerochat.incrementalHead
                version:
                  const: 1
                manifestKey:
                  type: string
                updatedAt:
                  type: integer
      responses:
        "200":
          description: Head saved
        "409":
          description: Refused to move head backwards
        "501":
          description: R2 binding is not configured
  /sync/object/{key}:
    get:
      summary: Read an encrypted incremental object from R2
      security:
        - bearerToken: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Encrypted object found
        "404":
          description: Object not found
    put:
      summary: Save an encrypted incremental object to R2
      security:
        - bearerToken: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object saved
        "400":
          description: Invalid encrypted object
        "413":
          description: Object too large
    delete:
      summary: Delete an obsolete encrypted incremental object
      security:
        - bearerToken: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Object deleted
  /proxy:
    get:
      summary: Optional AI provider proxy for model listing
      parameters:
        - name: x-zerochat-base-url
          in: header
          required: true
          schema:
            type: string
        - name: x-zerochat-provider-kind
          in: header
          required: true
          schema:
            enum: [openai-compatible, openai-responses, anthropic]
        - name: x-zerochat-proxy-token
          in: header
          required: true
          schema:
            type: string
        - name: x-zerochat-proxy-action
          in: header
          required: true
          schema:
            const: models
      responses:
        "200":
          description: Provider model list JSON
        "400":
          description: Missing provider metadata
        "403":
          description: Provider host is not allowed
    post:
      summary: Optional AI provider proxy for clients blocked by CORS
      parameters:
        - name: x-zerochat-base-url
          in: header
          required: true
          schema:
            type: string
        - name: x-zerochat-provider-kind
          in: header
          required: true
          schema:
            enum: [openai-compatible, openai-responses, anthropic]
        - name: x-zerochat-proxy-token
          in: header
          required: true
          schema:
            type: string
        - name: x-zerochat-proxy-action
          in: header
          required: false
          schema:
            enum: [chat]
      responses:
        "200":
          description: Provider response stream or JSON
        "400":
          description: Missing provider metadata
        "403":
          description: Provider host is not allowed
components:
  securitySchemes:
    bearerToken:
      type: http
      scheme: bearer
