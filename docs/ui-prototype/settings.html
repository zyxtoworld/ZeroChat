<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZeroChat Settings — UI Prototype</title>
<link rel="stylesheet" href="prototype.css">
<link rel="stylesheet" href="settings.css">
</head>
<body>

<div class="settings-page">
  <!-- Settings Nav -->
  <aside class="settings-nav">
    <button class="settings-back">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg>
      返回聊天
    </button>

    <nav class="settings-tabs">
      <button class="settings-tab">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        外观
      </button>
      <button class="settings-tab active">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2a4 4 0 0 0-4 4v2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2h-2V6a4 4 0 0 0-4-4z"/></svg>
        AI 服务
      </button>
      <button class="settings-tab">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 3h-8l-2 4h12l-2-4z"/></svg>
        模型
      </button>
      <button class="settings-tab">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        技能
      </button>
      <button class="settings-tab">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 0 1-9 9m9-9a9 9 0 0 0-9-9m9 9H3m9 9a9 9 0 0 1-9-9m9 9c1.66 0 3-4.03 3-9s-1.34-9-3-9m0 18c-1.66 0-3-4.03-3-9s1.34-9 3-9m-9 9a9 9 0 0 1 9-9"/></svg>
        同步
      </button>
      <button class="settings-tab">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        数据
      </button>
    </nav>

    <div class="settings-nav-footer">
      <span class="version-text">ZeroChat v1.0.0</span>
    </div>
  </aside>

  <!-- Settings Content -->
  <main class="settings-content">
    <div class="settings-content-inner">
      <header class="settings-header">
        <h1>AI 服务</h1>
        <p>管理你的 AI Provider 和 API Key</p>
      </header>

      <!-- Provider List -->
      <section class="settings-section">
        <div class="section-header">
          <h2>已配置的 Provider</h2>
          <button class="btn-secondary btn-sm">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            添加
          </button>
        </div>

        <div class="provider-cards">
          <div class="provider-card active">
            <div class="provider-card-header">
              <div class="provider-info">
                <div class="provider-icon openai">O</div>
                <div class="provider-meta">
                  <strong>OpenAI</strong>
                  <span>gpt-4o · 12 个模型</span>
                </div>
              </div>
              <div class="provider-status connected">
                <span class="status-dot"></span>
                已连接
              </div>
            </div>
          </div>

          <div class="provider-card">
            <div class="provider-card-header">
              <div class="provider-info">
                <div class="provider-icon anthropic">A</div>
                <div class="provider-meta">
                  <strong>Anthropic</strong>
                  <span>claude-4-sonnet · 5 个模型</span>
                </div>
              </div>
              <div class="provider-status connected">
                <span class="status-dot"></span>
                已连接
              </div>
            </div>
          </div>

          <div class="provider-card">
            <div class="provider-card-header">
              <div class="provider-info">
                <div class="provider-icon deepseek">D</div>
                <div class="provider-meta">
                  <strong>DeepSeek</strong>
                  <span>未配置 API Key</span>
                </div>
              </div>
              <div class="provider-status disconnected">
                <span class="status-dot"></span>
                未连接
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Provider Detail -->
      <section class="settings-section">
        <h2>OpenAI 设置</h2>

        <div class="form-grid">
          <label class="form-field">
            <span class="form-label">Provider 名称</span>
            <input type="text" value="OpenAI" class="form-input">
          </label>

          <label class="form-field">
            <span class="form-label">连接协议</span>
            <div class="form-readonly">OpenAI Responses API</div>
          </label>

          <label class="form-field">
            <span class="form-label">Base URL</span>
            <input type="text" value="https://api.openai.com/v1" class="form-input">
          </label>

          <label class="form-field">
            <span class="form-label">API Key</span>
            <div class="form-input-group">
              <input type="password" value="sk-proj-xxxxxxxxxxxxx" class="form-input">
              <button class="input-action" title="显示/隐藏">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <span class="form-hint">API Key 加密存储在本地，同步时进入加密 vault</span>
          </label>

          <label class="form-field">
            <span class="form-label">Worker/代理 URL（可选）</span>
            <input type="text" placeholder="https://your-worker.workers.dev" class="form-input">
            <span class="form-hint">浏览器遇到 CORS 限制时，可配置自己的 Cloudflare Worker</span>
          </label>

          <div class="form-field">
            <div class="form-switch-row">
              <div class="switch-info">
                <span class="form-label">直接请求 Provider</span>
                <span class="form-hint">不经过 Worker，直接从浏览器调用 API</span>
              </div>
              <label class="switch">
                <input type="checkbox" checked>
                <span class="switch-slider"></span>
              </label>
            </div>
          </div>

          <div class="form-actions">
            <button class="btn-primary">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4 12 14.01l-3-3"/></svg>
              检测连接
            </button>
            <button class="btn-danger">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
              删除 Provider
            </button>
          </div>
        </div>
      </section>
    </div>
  </main>
</div>

<button class="theme-toggle" onclick="toggleTheme()" title="切换主题">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
</button>

<script>
function toggleTheme() {
  const html = document.documentElement;
  const current = html.getAttribute('data-theme');
  html.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
}
</script>
</body>
</html>
